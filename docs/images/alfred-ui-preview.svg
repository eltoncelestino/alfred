<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 660" width="100%" height="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14" />
      <stop offset="100%" stop-color="#141923" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#E5C158" />
    </linearGradient>
  </defs>

  <rect width="1140" height="660" rx="18" fill="url(#canvasBg)" stroke="#232B3A" stroke-width="1.5" />

  <!-- ===================== SCREEN 1: ROTINA MATINAL HERO ===================== -->
  <g transform="translate(30, 28)">
    <rect width="340" height="604" rx="28" fill="#090B10" stroke="#2A3446" stroke-width="2" />
    <!-- HeaderBar -->
    <rect x="14" y="16" width="312" height="68" rx="12" fill="#11151E" stroke="#1E2533" />
    <circle cx="36" cy="38" r="13" fill="#1D2230" stroke="#D4AF37" />
    <text x="36" y="43" text-anchor="middle" font-size="12" font-weight="700" fill="#E5C158">A</text>
    <text x="58" y="37" font-size="12" font-weight="700" fill="#F8FAFC">ALFRED</text>
    <text x="58" y="50" font-size="9" fill="#94A3B8">MORDOMO EXECUTIVO</text>
    <rect x="200" y="26" width="114" height="22" rx="11" fill="#16231F" stroke="#10B981" stroke-opacity="0.4" />
    <circle cx="212" cy="37" r="3.5" fill="#10B981" />
    <text x="222" y="40" font-size="8.5" font-weight="600" fill="#A7F3D0">Aguardando "Alfred"</text>
    <text x="24" y="72" font-size="8.5" fill="#D4AF37">Escuta por voz ("Alfred"): ATIVA</text>

    <!-- Greeting -->
    <text x="20" y="114" font-size="20" font-weight="800" fill="#F8FAFC">Bom dia, Senhor.</text>
    <text x="20" y="132" font-size="10.5" fill="#94A3B8">Seu resumo executivo e sistemas de voz estão prontos.</text>

    <!-- Hero Card -->
    <rect x="16" y="146" width="308" height="360" rx="16" fill="#11151E" stroke="#D4AF37" stroke-opacity="0.45" />
    <rect x="30" y="162" width="166" height="20" rx="10" fill="#D4AF37" fill-opacity="0.15" />
    <text x="42" y="175" font-size="8.5" font-weight="700" fill="#E5C158">ROTINA MATINAL · PÓS-ALARME</text>
    <text x="30" y="204" font-size="14" font-weight="700" fill="#F8FAFC">Despertador &amp; Resumo do Dia</text>
    <text x="30" y="222" font-size="9.5" fill="#94A3B8">Diga "Alfred" ou acione após concluir o Alarmy.</text>

    <!-- Feed 1: Clima -->
    <rect x="30" y="236" width="280" height="48" rx="10" fill="#171C28" stroke="#232B3A" />
    <text x="42" y="251" font-size="8" font-weight="700" fill="#64748B">CLIMA LOCAL</text>
    <circle cx="296" cy="248" r="3.5" fill="#10B981" />
    <text x="42" y="266" font-size="11" font-weight="700" fill="#F8FAFC">24°C · céu limpo e ensolarado</text>
    <text x="42" y="278" font-size="8.5" fill="#94A3B8">São Paulo (Máx 27° / Mín 18°)</text>

    <!-- Feed 2: Agenda -->
    <rect x="30" y="292" width="280" height="48" rx="10" fill="#171C28" stroke="#232B3A" />
    <text x="42" y="307" font-size="8" font-weight="700" fill="#64748B">AGENDA DE HOJE</text>
    <circle cx="296" cy="304" r="3.5" fill="#10B981" />
    <text x="42" y="322" font-size="10.5" font-weight="600" fill="#F8FAFC">10:00 · Reunião com a equipe</text>
    <text x="42" y="334" font-size="10.5" font-weight="600" fill="#F8FAFC">12:30 · Almoço executivo</text>

    <!-- Feed 3: E-mail -->
    <rect x="30" y="348" width="280" height="48" rx="10" fill="#171C28" stroke="#232B3A" />
    <text x="42" y="363" font-size="8" font-weight="700" fill="#64748B">CAIXA DE ENTRADA (E-MAIL)</text>
    <circle cx="296" cy="360" r="3.5" fill="#10B981" />
    <text x="42" y="378" font-size="10.5" font-weight="700" fill="#F8FAFC">Conta Gmail Conectada (IMAP TLS)</text>
    <text x="42" y="390" font-size="8.5" fill="#94A3B8">3 e-mails recentes (remetente + assunto)</text>

    <!-- Feed 4: Manchetes -->
    <rect x="30" y="404" width="280" height="42" rx="10" fill="#171C28" stroke="#232B3A" />
    <text x="42" y="418" font-size="8" font-weight="700" fill="#64748B">MANCHETES (ATÉ 3 ITENS)</text>
    <circle cx="296" cy="415" r="3.5" fill="#10B981" />
    <text x="42" y="434" font-size="9" fill="#E2E8F0">• Indicadores econômicos abrem em alta nesta manhã...</text>

    <!-- CTA Button -->
    <rect x="30" y="456" width="280" height="38" rx="10" fill="url(#goldAccent)" />
    <text x="46" y="479" font-size="11" font-weight="700" fill="#090B10">Despertador encerrado · Iniciar rotina</text>
    <text x="290" y="480" font-size="13" font-weight="700" fill="#090B10">→</text>

    <text x="170" y="588" text-anchor="middle" font-size="11" font-weight="700" fill="#94A3B8">1. Painel Executivo &amp; Feeds em Tempo Real</text>
  </g>

  <!-- ===================== SCREEN 2: CONVERSA POR VOZ & AGENDA ===================== -->
  <g transform="translate(400, 28)">
    <rect width="340" height="604" rx="28" fill="#090B10" stroke="#2A3446" stroke-width="2" />

    <!-- Armed Banner -->
    <rect x="16" y="18" width="308" height="34" rx="10" fill="#16231F" stroke="#10B981" stroke-opacity="0.5" />
    <circle cx="32" cy="35" r="4.5" fill="#10B981" />
    <text x="46" y="39" font-size="10" font-weight="600" fill="#A7F3D0">Escuta ativa: pode falar seu comando</text>

    <!-- Alfred Opening Message -->
    <rect x="16" y="66" width="308" height="148" rx="12" fill="#11151E" stroke="#232B3A" />
    <rect x="16" y="66" width="4" height="148" rx="2" fill="#D4AF37" />
    <circle cx="34" cy="84" r="9" fill="#1D2230" stroke="#D4AF37" />
    <text x="34" y="88" text-anchor="middle" font-size="9" font-weight="700" fill="#E5C158">A</text>
    <text x="50" y="87" font-size="9.5" font-weight="700" fill="#E5C158">ALFRED · 07:00</text>
    <rect x="268" y="74" width="44" height="20" rx="6" fill="#171C28" />
    <text x="290" y="87" text-anchor="middle" font-size="8.5" fill="#94A3B8">Ouvindo</text>
    <text x="28" y="110" font-size="10.5" fill="#F8FAFC">Bom dia! Aqui é o Alfred. Missão cumprida, você</text>
    <text x="28" y="126" font-size="10.5" fill="#F8FAFC">já está de pé. São sete da manhã e o tempo está</text>
    <text x="28" y="142" font-size="10.5" fill="#F8FAFC">agradável, vinte e quatro graus, com sol o dia</text>
    <text x="28" y="158" font-size="10.5" fill="#F8FAFC">todo. Pequenas ações de hoje constroem grandes</text>
    <text x="28" y="174" font-size="10.5" fill="#F8FAFC">resultados. Por onde quer começar? Posso ler</text>
    <text x="28" y="190" font-size="10.5" fill="#F8FAFC">notícias, ver e-mails ou repassar a agenda.</text>

    <!-- User Bubble -->
    <rect x="74" y="226" width="250" height="48" rx="14" fill="#181F2E" stroke="#2E3A52" />
    <text x="88" y="247" font-size="10.5" fill="#F8FAFC">Marca reunião com o cliente hoje às dez.</text>
    <text x="308" y="266" text-anchor="end" font-size="8" fill="#64748B">07:01</text>

    <!-- Alfred Conflict Detection Reply -->
    <rect x="16" y="286" width="308" height="104" rx="12" fill="#11151E" stroke="#232B3A" />
    <rect x="16" y="286" width="4" height="104" rx="2" fill="#D4AF37" />
    <text x="28" y="307" font-size="9.5" font-weight="700" fill="#E5C158">ALFRED · 07:01</text>
    <text x="28" y="328" font-size="10.5" fill="#F8FAFC">Atenção, você já tem reunião com a equipe às</text>
    <text x="28" y="344" font-size="10.5" fill="#F8FAFC">dez. O próximo horário livre é onze da manhã.</text>
    <text x="28" y="360" font-size="10.5" fill="#F8FAFC">Prefere marcar às onze?</text>

    <!-- Quick Actions Bar -->
    <g transform="translate(16, 442)">
      <rect x="0" y="0" width="144" height="28" rx="14" fill="#11151E" stroke="#2E3A52" />
      <text x="72" y="18" text-anchor="middle" font-size="9" font-weight="600" fill="#CBD5E1">Missão Alarmy concluída</text>
      <rect x="152" y="0" width="110" height="28" rx="14" fill="#11151E" stroke="#2E3A52" />
      <text x="207" y="18" text-anchor="middle" font-size="9" font-weight="600" fill="#CBD5E1">Repassar a agenda</text>
    </g>

    <!-- Active Recording Composer -->
    <rect x="16" y="480" width="308" height="26" rx="6" fill="#2A1215" stroke="#EF4444" stroke-opacity="0.5" />
    <circle cx="28" cy="493" r="4" fill="#EF4444" />
    <text x="38" y="497" font-size="9" font-weight="600" fill="#FCA5A5">Gravando comando de voz</text>
    <text x="312" y="497" text-anchor="end" font-size="9" font-weight="700" fill="#EF4444">00:03</text>

    <rect x="16" y="514" width="212" height="42" rx="10" fill="#171C28" stroke="#2E3A52" />
    <text x="28" y="539" font-size="9.5" fill="#64748B">Peça algo ao Alfred ou diga 'Alfred'...</text>
    <rect x="236" y="514" width="88" height="42" rx="10" fill="#EF4444" />
    <text x="280" y="539" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">Enviar voz</text>

    <text x="170" y="588" text-anchor="middle" font-size="11" font-weight="700" fill="#94A3B8">2. Diálogo Falado &amp; Conflitos de Agenda</text>
  </g>

  <!-- ===================== SCREEN 3: VINCULAÇÃO DE E-MAIL MODAL ===================== -->
  <g transform="translate(770, 28)">
    <rect width="340" height="604" rx="28" fill="#090B10" stroke="#2A3446" stroke-width="2" />
    <rect x="14" y="76" width="312" height="482" rx="20" fill="#11151E" stroke="#2E3A52" />

    <text x="30" y="108" font-size="14" font-weight="700" fill="#F8FAFC">Vincular Conta de E-mail</text>
    <text x="304" y="108" text-anchor="end" font-size="14" fill="#94A3B8">✕</text>
    <text x="30" y="130" font-size="9.5" fill="#94A3B8">Configure a leitura segura da sua caixa de entrada</text>
    <text x="30" y="144" font-size="9.5" fill="#94A3B8">para o Alfred informar remetente e assunto:</text>

    <text x="30" y="170" font-size="8.5" font-weight="700" fill="#E5C158">SEU ENDEREÇO DE E-MAIL</text>
    <rect x="30" y="178" width="280" height="34" rx="8" fill="#090B10" stroke="#2E3A52" />
    <text x="42" y="199" font-size="10" fill="#E2E8F0">usuario@gmail.com</text>

    <!-- Option 1 -->
    <rect x="30" y="224" width="280" height="94" rx="10" fill="#171C28" stroke="#232B3A" />
    <text x="42" y="242" font-size="10" font-weight="700" fill="#F8FAFC">Opção 1: Senha de App do Gmail (IMAP TLS)</text>
    <text x="42" y="256" font-size="8.5" fill="#94A3B8">Conexão direta via bridge local na porta 8081.</text>
    <rect x="42" y="268" width="256" height="34" rx="8" fill="#090B10" stroke="#2E3A52" />
    <text x="54" y="289" font-size="10" fill="#64748B">•••• •••• •••• ••••</text>

    <!-- Option 2 -->
    <rect x="30" y="328" width="280" height="78" rx="10" fill="#171C28" stroke="#232B3A" />
    <text x="42" y="346" font-size="10" font-weight="700" fill="#F8FAFC">Opção 2: Gmail OAuth 2.0 Access Token</text>
    <rect x="42" y="358" width="256" height="34" rx="8" fill="#090B10" stroke="#2E3A52" />
    <text x="54" y="379" font-size="9.5" fill="#64748B">Token OAuth 2.0 (escopo gmail.readonly)</text>

    <!-- Option 3 -->
    <rect x="30" y="416" width="280" height="74" rx="10" fill="#171C28" stroke="#232B3A" />
    <text x="42" y="434" font-size="10" font-weight="700" fill="#F8FAFC">Opção 3: Google Apps Script / Webhook JSON</text>
    <rect x="42" y="446" width="256" height="32" rx="8" fill="#090B10" stroke="#2E3A52" />
    <text x="54" y="466" font-size="9" fill="#64748B">https://script.google.com/macros/s/.../exec</text>

    <!-- Save CTA -->
    <rect x="30" y="504" width="280" height="40" rx="10" fill="url(#goldAccent)" />
    <text x="170" y="528" text-anchor="middle" font-size="11" font-weight="700" fill="#090B10">Salvar e Sincronizar E-mail</text>

    <text x="170" y="588" text-anchor="middle" font-size="11" font-weight="700" fill="#94A3B8">3. Integração Multi-Estratégia de E-mail</text>
  </g>
</svg>
